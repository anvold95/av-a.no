backend:
  name: github
  repo: anvold95/av-a-website
  branch: main
  base_url: "https://av-a-oauth.vercel.app"
  auth_endpoint: "/api/auth"
media_folder: "img/projects"
public_folder: "/img/projects"

collections:
  - name: "innhold"
    label: "Innhold"
    files:
      - file: "content.json"   # <- da må content.json ligge i web-roten
        label: "Tekst og innhold"
        name: "content"
        fields:
          - label: "Om oss (avsnitt)"
            name: "about"
            widget: object
            fields:
              - { label: "Avsnitt", name: "paragraphs", widget: list, field: { label: "Tekst", name: "text", widget: text } }
          - { label: "Tjenester", name: "services", widget: list }
          - label: "CTA"
            name: "cta"
            widget: object
            fields:
              - { label: "E-post/lenke", name: "href", widget: string }
          - label: "Instagram"
            name: "instagram"
            widget: object
            fields:
              - { label: "Profil-URL", name: "profileUrl", widget: string, required: false }
              - { label: "Post-URL", name: "postUrl", widget: string, required: false }
              - { label: "Embed HTML", name: "embedHtml", widget: text, required: false }
          - label: "Prosjektbilder"
            name: "projects"
            widget: list
            summary: "{{fields.caption}}"
            fields:
              - { label: "Bilde", name: "src", widget: image }
              - { label: "Alt-tekst", name: "alt", widget: string, required: false }
              - { label: "Bildetekst", name: "caption", widget: string, required: false }
          - label: "Sentralt godkjent"
            name: "cert"
            widget: object
            fields:
              - { label: "Logo", name: "logo", widget: image, required: false }
              - { label: "Tekst", name: "text", widget: string }
              - { label: "Lenke", name: "link", widget: string }
          - label: "Sosiale lenker"
            name: "social"
            widget: object
            fields:
              - { label: "LinkedIn", name: "linkedin", widget: string, required: false }
              - { label: "Instagram", name: "instagram", widget: string, required: false }
