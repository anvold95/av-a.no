<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>A. Vold Arkitektur AS</title>
  <meta name="description" content="A. Vold Arkitektur AS – arkitektur, transformasjon og objekter.">
  <link rel="preload" href="styles.css" as="style">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skiplink" href="#innhold">Hopp til innhold</a>

  <header class="site-header">
    <div class="container head-grid">
      <div class="logo">
        a.-vold<br>
        <span class="sub-logo">architecture,<br>transformation &<br>objects</span>
      </div>
      <nav class="main-nav" aria-label="Hovedmeny">
        <ul>
          <li><a href="#tjenester">Tjenester</a></li>
          <li><a href="#info">Info</a></li>
          <li><a href="#prosjekter">Prosjekter</a></li>
          <li><a href="#kontakt">Kontakt</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="innhold" class="container three-grid">
    <!-- Kolonne 1: Tekst -->
    <section id="info" class="panel text-panel">
      <h1 class="brand">A. VOLD ARKITEKTUR AS</h1>
      <div id="about-text" class="flow"></div>

      <section id="tjenester" class="flow">
        <h2>Tjenester</h2>
        <ul id="services-list" class="list-clean"></ul>
      </section>

      <p class="cta">
        <a id="cta-link" class="link-underline" href="#" rel="noopener">Forespørsel om bistand</a>
      </p>
    </section>

    <!-- Kolonne 2: Instagram -->
    <section class="panel insta-panel" aria-label="Instagram">
      <div id="instagram-embed" class="insta-embed">
        <!-- Dynamisk fra content.json -->
      </div>
      <noscript>
        <p><a id="instagram-fallback" href="#" target="_blank" rel="noopener">Se Instagram</a></p>
      </noscript>
    </section>

    <!-- Kolonne 3: Karusell + Sentralt godkjent -->
    <section id="prosjekter" class="panel projects-panel">
      <div class="carousel" aria-label="Prosjektbilder">
        <button class="car-btn prev" aria-label="Forrige" data-dir="-1">←</button>
        <div class="car-track" id="car-track"></div>
        <button class="car-btn next" aria-label="Neste" data-dir="1">→</button>
        <div class="car-dots" id="car-dots" role="tablist" aria-label="Bildeindekser"></div>
      </div>

      <div class="cert">
        <img id="cert-logo" src="img/logo-sentralt-godkjent.png" alt="Sentralt godkjent" width="96" height="96" loading="lazy">
        <p id="cert-text" class="muted"></p>
        <p><a id="cert-link" class="link-underline" href="#" target="_blank" rel="noopener">Les mer</a></p>
      </div>
    </section>
  </main>

  <section id="kontakt" class="contact">
    <p class="kicker">Har du et prosjekt?</p>
    <p class="email"><a href="mailto:post@av-a.no">post@av-a.no</a></p>
  </section>

  <footer class="site-footer">
    <div class="container">
      <ul class="social-links">
        <li><a id="linkedin-link" href="#" aria-label="LinkedIn">LinkedIn</a></li>
        <li><a id="instagram-link" href="#" aria-label="Instagram">Instagram</a></li>
      </ul>
    </div>
  </footer>

  <!-- Data + logikk -->
  <script defer src="script.js"></script>
  <!-- Instagram script lastes kun når embed brukes -->
</body>
</html>
