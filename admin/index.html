<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Innholdsredigering</title>
  <style>
    body { font-family: ui-monospace, Menlo, Consolas, monospace; padding: 16px; }
    #log { white-space: pre-wrap; line-height: 1.4; }
    .ok { color: #0a0; } .err { color: #a00; }
  </style>
</head>
<body>
  <h1>Admin – debug</h1>
  <div id="log">Starter…</div>

  <script>
    const L = (m, cls='') => {
      const el = document.getElementById('log');
      const line = document.createElement('div');
      if (cls) line.className = cls;
      line.textContent = m;
      el.appendChild(line);
    };

    // 1) Sjekk at config.yml er tilgjengelig
    L('Sjekker config.yml …');
    fetch('/admin/config.yml', { cache: 'no-store' })
      .then(r => L(`config.yml status: ${r.status} ${r.ok ? '(OK)' : '(IKKE FUNNET)'}`, r.ok ? 'ok' : 'err'))
      .catch(e => L('config fetch error: ' + e, 'err'));

    // 2) Logg auth-meldinger fra popup (token)
    window.addEventListener('message', (e) => {
      L('AUTH MESSAGE → ' + JSON.stringify(e.data) + '  FROM ' + e.origin, 'ok');
    });

    // 3) Slå av auto-init; vi initierer selv når skriptet er lastet
    window.CMS_MANUAL_INIT = true;

    // 4) Funksjon som kalles når CMS-skriptet er lastet
    window.__cmsLoaded = () => {
      L('decap-cms.js lastet. typeof CMS = ' + (typeof CMS), (typeof CMS === 'function') ? 'ok' : 'err');
      try {
        CMS.init({ config: { load_config_file: true } });
        L('CMS.init() kalt', 'ok');
      } catch (e) {
        L('CMS.init() feilet: ' + e, 'err');
      }
    };
    <script>
  window.addEventListener('message', (e) => {
    console.log('AUTH MESSAGE →', e.data, 'FROM', e.origin);
    alert('AUTH MESSAGE mottatt: ' + (typeof e.data === 'string' ? e.data.slice(0,60)+'…' : JSON.stringify(e.data).slice(0,60)+'…'));
  });
</script>

  </script>

  <!-- Last CMS fra CDN (vi kan bytte til lokal fil senere) -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"
          onload="window.__cmsLoaded()"
          onerror="document.getElementById('log').innerHTML += '\n' + 'decap-cms.js kunne ikke lastes'"></script>
</body>
</html>
