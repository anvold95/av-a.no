<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>A. Vold Arkitektur AS</title>
  <meta name="description" content="A. Vold Arkitektur AS – arkitektur, transformasjon og objekter.">
  <link rel="preload" href="styles.css" as="style">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skiplink" href="#innhold">Hopp til innhold</a>

  <!-- Minimal toppstripe -->
  <header class="site-header kba">
    <div class="container head-grid">
      <a class="logo" href="#top" aria-label="Forside">
        a.-vold
        <span class="sub-logo">architecture, transformation & objects</span>
      </a>
      <nav class="main-nav" aria-label="Hovedmeny">
        <ul>
          <li><a href="#prosjekter">Prosjekter</a></li>
          <li><a href="#tjenester">Tjenester</a></li>
          <li><a href="#info">Info</a></li>
          <li><a href="#kontakt">Kontakt</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- HERO: rolig, fullskjerm, bilde-fokus -->
 <!-- <section id="top" class="hero" aria-label="Utvalgte prosjekter">
    <div class="hero-images" id="hero-images" aria-hidden="true"></div>
    <div class="hero-overlay">
      <h1 class="brand-hero">A. VOLD<br>ARKITEKTUR AS</h1>
      <p class="hero-kicker">arkitektur · transformasjon · objekter</p>
      <a class="hero-cta" href="#prosjekter">Se prosjekter</a>
    </div>
    <button class="hero-btn prev" aria-label="Forrige">←</button>
    <button class="hero-btn next" aria-label="Neste">→</button>
  </section> -->

  <!-- Innhold -->
  <main id="innhold">

    <!-- Bildedrevet prosjektrist -->
    <section id="prosjekter" class="section projects">
      <div class="section-head">
        <h2>Prosjekter</h2>
        <p class="muted">Et utvalg arbeider</p>
      </div>
      <div class="grid" id="projects-grid" aria-live="polite"></div>
      <!-- Lettvekts lightbox -->
      <div id="lightbox" class="lightbox" hidden>
        <button class="lightbox-close" aria-label="Lukk">×</button>
        <figure class="lightbox-fig">
          <img id="lightbox-img" alt="">
          <figcaption id="lightbox-cap" class="muted"></figcaption>
        </figure>
      </div>
    </section>

    <!-- Info + tjenester i to kolonner -->
    <section class="section two-col" id="studio">
      <div id="info" class="text-col">
        <h2>Info</h2>
        <div id="about-text" class="flow"></div>

        <section id="tjenester" class="flow">
          <h3>Tjenester</h3>
          <ul id="services-list" class="list-clean"></ul>
        </section>

        <p class="cta">
          <a id="cta-link" class="link-underline" href="#" rel="noopener">Forespørsel om bistand</a>
        </p>
      </div>

      <!-- Instagram / Journal-lignende strøm -->
      <aside class="journal">
        <h3 class="visually-hidden">Instagram</h3>
        <div id="instagram-embed" class="insta-embed"></div>
        <noscript>
          <p><a id="instagram-fallback" href="#" target="_blank" rel="noopener">Se Instagram</a></p>
        </noscript>

        <!-- Sertifikat -->
        <div class="cert">
          <img id="cert-logo" src="img/logo-sentralt-godkjent.png" alt="Sentralt godkjent" width="96" height="96" loading="lazy">
          <div>
            <p id="cert-text" class="muted"></p>
            <p><a id="cert-link" class="link-underline" href="#" target="_blank" rel="noopener">Les mer</a></p>
          </div>
        </div>
      </aside>
    </section>
  </main>

  <!-- Kontaktstripe -->
  <section id="kontakt" class="contact">
    <p class="kicker">Har du et prosjekt?</p>
    <p class="email"><a href="mailto:post@av-a.no">post@av-a.no</a></p>
  </section>

  <footer class="site-footer">
    <div class="container">
      <ul class="social-links">
        <li><a id="linkedin-link" href="#" aria-label="LinkedIn">LinkedIn</a></li>
        <li><a id="instagram-link" href="#" aria-label="Instagram">Instagram</a></li>
      </ul>
    </div>
  </footer>

  <script defer src="script.js"></script>
</body>
</html>
