<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>A. Vold Arkitektur AS</title>
  <meta name="description" content="A. Vold Arkitektur AS – arkitektur, transformasjon og objekter.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skiplink" href="#main">Hopp til innhold</a>

  <!-- Sticky header -->
  <header class="site-header">
    <div class="container head-grid">
      <a class="logo" href="#top">A. Vold Architecture</a>
      <nav class="main-nav">
        <ul>
          <li><a href="#prosjekter">Works</a></li>
          <li><a href="#studio">Studio</a></li>
          <li><a href="#journal">Journal</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Hero carousel -->
  <section id="top" class="hero" aria-label="Utvalgte prosjekter">
    <button class="hero-btn prev" aria-label="Forrige">←</button>
    <div class="hero-container" id="hero-images">
      <!-- Images injected by script.js -->
    </div>
    <div class="hero-counter" id="hero-counter"></div>
    <button class="hero-btn next" aria-label="Neste">→</button>
  </section>

  <main id="main">
    <!-- Studio + Instagram -->
    <section class="section two-col studio-social">
      <div id="studio" class="text-col">
        <h2>Studio</h2>
        <p>Et arkitektkontor med vekt på transformasjon, restaurering og gjenbruk.</p>
        <h3>Tjenester</h3>
        <ul id="services-list"></ul>
      </div>
      <aside class="journal">
        <h2>Instagram</h2>
        <div id="instagram-embed" class="insta-embed"></div>
      </aside>
    </section>

    <!-- Prosjekter grid -->
    <section id="prosjekter" class="section projects">
      <h2>Prosjekter</h2>
      <div class="projects-grid" id="projects-grid"></div>
    </section>
  </main>

  <!-- Sticky footer -->
  <footer class="site-footer">
    <div class="container footer-grid">
      <p>&copy; 2025 A. Vold Arkitektur AS</p>
      <nav class="social-nav">
        <ul>
          <li><a id="linkedin-link" href="#">LinkedIn</a></li>
          <li><a id="instagram-link" href="#">Instagram</a></li>
        </ul>
      </nav>
    </div>
  </footer>

  <script defer src="script.js"></script>
</body>
</html>
