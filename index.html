<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>A. Vold Arkitektur AS</title>
  <meta name="description" content="A. Vold Arkitektur AS – arkitektur, transformasjon og objekter.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Skip link -->
  <a class="skiplink" href="#innhold">Hopp til innhold</a>

  <!-- Header (inspirert av Kolman Boye: minimal) -->
  <header class="site-header">
    <div class="container head-grid">
      <a class="logo" href="#top">A. Vold Architects</a>
      <nav class="main-nav" aria-label="Hovedmeny">
        <ul>
          <li><a href="#prosjekter">Works</a></li>
          <li><a href="#studio">Studio</a></li>
          <li><a href="#journal">Journal</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Hero full-bredde bilde med tittel over -->
  <section id="top" class="hero">
    <img src="img/SQUARE-2-.jpg" alt="Hovedprosjekt" class="hero-img">
    <div class="hero-caption">
      <span class="hero-date">2024.08.01</span>
      <span class="hero-title">Ravine House, Sweden</span>
      <a href="#prosjekter" class="hero-link">Read more</a>
    </div>
  </section>

  <!-- Main content -->
  <main id="innhold">
    <!-- Prosjekter grid -->
    <section id="prosjekter" class="section projects">
      <div class="container">
        <div class="projects-grid">
          <!-- Gjenta for hvert prosjekt -->
          <div class="project-item">
            <img src="img/SQUARE10.jpg" alt="Prosjekt 1">
            <div class="project-info">
              <span class="project-date">2023.05.15</span>
              <h3 class="project-title">Rehabilitering etterkrigshus</h3>
            </div>
          </div>
          <div class="project-item">
            <img src="img/SQUARE18.jpg" alt="Prosjekt 2">
            <div class="project-info">
              <span class="project-date">2022.11.20</span>
              <h3 class="project-title">Ombygging næringslokaler</h3>
            </div>
          </div>
          <!-- Flere items ... -->
        </div>
      </div>
    </section>

    <!-- Studio-seksjon -->
    <section id="studio" class="section studio">
      <div class="container two-col">
        <div class="text-col">
          <h2>Studio</h2>
          <p>… Om oss …</p>
        </div>
        <aside class="sidebar">
          <h2>Journal</h2>
        </aside>
      </div>
    </section>
  </main>

  <!-- Footer minimal -->
  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2024 A. Vold Architects</p>
    </div>
  </footer>

  <script defer src="script.js"></script>
</body>
</html>
